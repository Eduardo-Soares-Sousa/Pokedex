<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/favicon-pokeball.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">

    <title>Pokédex</title>
</head>
<body>
    <main>
        <div class="container">
            <img src="images/pokedex.png" class="pokedex" alt="Pokédex">
            
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/6.gif" alt="pokemon image" class="pokemon-image"> <!-- Aqui será um gif/imagem do pokemon vinda da api -->

            <h1 class="info-pokemon">
                <span class="pokemon-number">6</span>-
                <span class="pokemon-name">Charizard</span>
            </h1>

            <form class="form">
                <input type="search" id="name" class="search-pokemon" placeholder="Enter the Pokemon'ID or name" required>
            </form>

            <div class="buttons">
                <button class="button btn-previous">&lt;Previous</button>
                <button class="button btn-next">Next&gt;</button>
            </div>
        </div>
    </main>
</body>
</html>
